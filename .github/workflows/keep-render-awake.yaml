name: Keep Render Awake

on:
  schedule:
    # Jalan tiap 5 menit. Catatan: scheduled workflow GitHub sering telat
    # 10-30 menit saat jam sibuk, sedangkan Render free tidur setelah 15 menit
    # idle. Kalau cold start masih sering kejadian, pakai pinger eksternal
    # (cron-job.org / UptimeRobot) yang jauh lebih tepat waktu.
    - cron: "*/5 * * * *"

  # Bisa dijalankan manual dari GitHub Actions tab
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      # Ping KEDUA service. Rantai request browser melewati Express dulu baru
      # FastAPI, jadi dua-duanya harus melek. Hit endpoint health (bukan -I /)
      # supaya benar-benar membangunkan app, bukan cuma cek TCP.
      - name: Ping ML service (FastAPI)
        run: curl -fsS --max-time 60 https://panen-cerdas-ml.onrender.com/api/health || true

      - name: Ping Express gateway
        run: curl -fsS --max-time 60 https://panen-cerdas-express.onrender.com/api/health || true
